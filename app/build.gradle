plugins {
    id 'com.android.application'
}

android {
    namespace 'com.takidz.vcamhook'
    compileSdk 34

    defaultConfig {
        applicationId "com.takidz.vcamhook"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'de.robv.android.xposed:api:82'
}
